<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Perspective Document Spotlight</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #050505;
      color: #fff;
      font-family: "serif";
      overflow: hidden;
    }
    
    /* ON/OFF 切り替えボタンのスタイル */
    #toggleUiBtn {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 1002;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 13px;
      backdrop-filter: blur(10px);
      transition: background 0.2s;
    }

    #toggleUiBtn:hover {
      background: rgba(50, 50, 50, 0.8);
    }

    #ui {
      position: fixed; 
      top: 52px; 
      right: 12px;
      background: rgba(0, 0, 0, 0.8); padding: 16px; border-radius: 8px;
      backdrop-filter: blur(10px); z-index: 1001; width: 300px;
      max-height: calc(100vh - 80px);
      overflow-y: auto;
    }
    
    .hidden {
      display: none !important;
    }

    textarea {
      width: 100%;
      height: 100px;
      background: #222;
      color: #fff;
      border: 1px solid #444;
      border-radius: 4px;
      font-size: 12px;
      margin-bottom: 10px;
      resize: none;
    }
    
    input[type=range] { 
      width: 100%;
    }
    
    h3 {
      margin: 0 0 10px;
      font-size: 14px;
      color: #e0e0e0;
      border-bottom: 1px solid #444;
      padding-bottom: 5px;
    }
  </style>
  <script src="https://unpkg.com/p5@1.9.3/lib/p5.min.js"></script>
</head>
<body>
  <button id="toggleUiBtn" onclick="toggleUI()">⚙️ 設定 UI</button>

  <div id="ui">
    <h3>Perspective Spotlight</h3>
    <textarea id="textInput" placeholder="文章を入力してください..."></textarea>
    <div class="row"><span>Highlight Line</span><input id="targetLine" type="range" min="0" max="0" step="1" value="0"></div>
    <div class="row"><span>Beam Width</span><input id="beamWidth" type="range" min="20" max="150" step="1" value="60"></div>
    <div class="row"><span>Darkness</span><input id="darkness" type="range" min="100" max="255" step="1" value="230"></div>
    <div class="row"><span>Brightness</span><input id="lightBrightness" type="range" min="0" max="255" step="1" value="150"></div>
    
    <h3>Perspective & Rotation</h3>
    <div class="row"><span>Doc Rot X</span><input id="docRotX" type="range" min="-90" max="90" step="1" value="-30"></div>
    <div class="row"><span>Doc Rot Y</span><input id="docRotY" type="range" min="-90" max="90" step="1" value="10"></div>
    <div class="row"><span>Doc Rot Z</span><input id="docRotZ" type="range" min="-180" max="180" step="1" value="0"></div>
    <div class="row"><span>Light Angle</span><input id="lightAng" type="range" min="-180" max="180" step="1" value="-25"></div>
    <!-- minを1、maxを160に広げてズーム範囲を拡張 -->
    <div class="row"><span>FOV (Zoom)</span><input id="fov" type="range" min="1" max="160" step="1" value="45"></div>
  </div>

  <script>
    let wrappedLines = [];
    let currentY = 0;
    let targetY = 0;
    let textGraphics;
    let spotMaskGraphics;
    let spotLightGraphics;
    let paperSize = [1000, 1200];
    let fontSize = 28;
    let lineHeight = 36;

    // UIの表示/非表示を切り替える関数
    function toggleUI() {
      const ui = document.getElementById('ui');
      ui.classList.toggle('hidden');
    }

    function setup() {
      createCanvas(windowWidth, windowHeight, WEBGL);
      
      textGraphics = createGraphics(paperSize[0], paperSize[1]);
      spotMaskGraphics = createGraphics(paperSize[0], paperSize[1]);
      spotLightGraphics = createGraphics(paperSize[0], paperSize[1]);
      
      updateText();
      currentY = paperSize[1] / 2;
    }

    function draw() {
      background(5);
      updateTextGraphics();
      
      let fovVal = parseInt(document.getElementById('fov').value);
      perspective(radians(fovVal), width/height, 0.1, 7000);
      
      let dRotX = parseInt(document.getElementById('docRotX').value);
      let dRotY = parseInt(document.getElementById('docRotY').value);
      let dRotZ = parseInt(document.getElementById('docRotZ').value);

      push();
      rotateX(radians(dRotX));
      rotateY(radians(dRotY));
      rotateZ(radians(dRotZ));
      
      // 紙の描画
      texture(textGraphics);
      noStroke();
      rect(0, 0, paperSize[0], paperSize[1]);
      pop();

      // ライトの描画
      push();
      rotateX(radians(dRotX));
      rotateY(radians(dRotY));
      rotateZ(radians(dRotZ));
      drawSpotlight();
      pop();
    }

    function updateText() {
      let rawText = document.getElementById('textInput').value;
      let maxWidth = paperSize[0] - 150; // 左右の余白
      
      wrappedLines = [];
      textGraphics.textSize(fontSize);
      let paragraphs = rawText.split('\n');
      
      for (let p of paragraphs) {
        let currentLine = "";
        for (let i = 0; i < p.length; i++) {
          let char = p[i];
          let testLine = currentLine + char;
          if (textGraphics.textWidth(testLine) > maxWidth) {
            wrappedLines.push(currentLine);
            currentLine = char;
          } else {
            currentLine = testLine;
          }
        }
        wrappedLines.push(currentLine);
      }
      
      // スライダーの最大値を更新
      document.getElementById('targetLine').max = max(0, wrappedLines.length - 1);
    }

    function updateTextGraphics() {
      textGraphics.background(235, 230, 215); 
      textGraphics.fill(40);
      textGraphics.textFont('serif');
      textGraphics.textSize(fontSize);
      textGraphics.textAlign(LEFT, TOP);
      
      textGraphics.push();
      textGraphics.translate(75, 100);
      for (let i = 0; i < wrappedLines.length; i++) {
        textGraphics.text(wrappedLines[i], 0, i * lineHeight);
      }
      textGraphics.pop();

      let targetIdx = parseInt(document.getElementById('targetLine').value);
      targetY = 100 + (targetIdx * lineHeight) + (fontSize/2);
      currentY = lerp(currentY, targetY, 0.1);
    }

    function drawSpotlight() {
      let bWidth = parseInt(document.getElementById('beamWidth').value);
      let darkAlpha = parseInt(document.getElementById('darkness').value);
      let brightVal = parseInt(document.getElementById('lightBrightness').value);
      let lightAngVal = parseInt(document.getElementById('lightAng').value);
      let blurSize = 80;

      buildSpotlightTextures(bWidth, darkAlpha, brightVal, lightAngVal, blurSize);

      translate(0, 0, 2); // z-fighting防止
      noStroke();

      // 暗闇マスク
      texture(spotMaskGraphics);
      rect(0, 0, paperSize[0], paperSize[1]);

      // 加算ライト
      blendMode(ADD);
      texture(spotLightGraphics);
      rect(0, 0, paperSize[0], paperSize[1]);
      blendMode(BLEND);
    }

    function buildSpotlightTextures(bWidth, darkAlpha, brightVal, lightAngVal, blurSize) {
      let cx = paperSize[0] / 2;
      let beamLength = paperSize[0] * 2.0;
      let startX = -paperSize[0] * 0.6;
      let endX = startX + beamLength;

      // 1. マスク（暗闇の中に光の通り道を作る）
      spotMaskGraphics.clear();
      spotMaskGraphics.background(0, darkAlpha);
      spotMaskGraphics.push();
      spotMaskGraphics.translate(cx, currentY);
      spotMaskGraphics.rotate(radians(lightAngVal));
      
      spotMaskGraphics.erase(255, 0);
      drawBeamQuad(spotMaskGraphics, startX, endX, bWidth, bWidth * 1.5);
      spotMaskGraphics.noErase();

      // 境界のボケ
      for (let i = 1; i <= 15; i++) {
        let t = i / 15;
        spotMaskGraphics.erase(map(t, 0, 1, 30, 0), 0);
        drawBeamQuad(spotMaskGraphics, startX, endX, bWidth + blurSize*t, (bWidth * 1.5) + blurSize*t);
        spotMaskGraphics.noErase();
      }
      spotMaskGraphics.pop();

      // 2. 加算ライト（明るさ調整に対応）
      spotLightGraphics.clear();
      spotLightGraphics.push();
      spotLightGraphics.translate(cx, currentY);
      spotLightGraphics.rotate(radians(lightAngVal));
      
      for (let i = 15; i >= 0; i--) {
        let t = i / 15;
        // Brightnessスライダーの値をアルファに反映
        let alpha = map(i, 15, 0, 0, map(brightVal, 0, 255, 0, 80));
        spotLightGraphics.fill(255, 220, 150, alpha);
        spotLightGraphics.noStroke();
        drawBeamQuad(spotLightGraphics, startX, endX, bWidth + blurSize*t, (bWidth * 1.5) + blurSize*t);
      }
      spotLightGraphics.pop();
    }

    function drawBeamQuad(g, startX, endX, startWidth, endWidth) {
      g.quad(startX, -startWidth / 2, endX, -endWidth / 2, endX, endWidth / 2, startX, startWidth / 2);
    }

    document.getElementById('textInput').addEventListener('input', updateText);

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
    }
  </script>
</body>
</html>
